name: Build

on:
  workflow_call:
    outputs:
      image:
        description: 'The Docker image built by this workflow'
        value: ${{ jobs.build.outputs.image }}
    secrets:
      SLACK_WEBHOOK:
        required: true

jobs:
  build:
    name: Build and push Docker container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: ORKIVAR - Test and build
        run: ./gradlew build
      - name: Push docker image to GAR
        uses: nais/docker-build-push@d3a1f7e259ecc381a50435e1d4add9059429ebd7
        id: docker-build-push
        with:
          docker_context: .
          team: dab
      - name: Slack Notification (test failure)
        if: failure()
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4
        env:
          SLACK_COLOR: danger
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: 'Orkivar: tester feilet under deploy til prod'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Commit-message til feilende deploy: ${{ github.event.head_commit.message }}'
